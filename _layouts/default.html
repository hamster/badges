<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      {% assign gh_owner = site.repository | split: '/' | first %}
      <a href="{{ '/' | relative_url }}" class="nav-brand">
        <img src="https://github.com/{{ gh_owner }}.png" alt="" class="nav-logo" width="28" height="28">
        {{ site.title }}
      </a>
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>All</a></li>
        <li><a href="{{ '/badge/' | relative_url }}"{% if page.url contains '/badge/' %} class="active"{% endif %}>Badges</a></li>
        <li><a href="{{ '/sao/' | relative_url }}"{% if page.url contains '/sao/' %} class="active"{% endif %}>SAOs</a></li>
        <li><a href="{{ '/minibadge/' | relative_url }}"{% if page.url contains '/minibadge/' %} class="active"{% endif %}>Minibadges</a></li>
        <li><a href="{{ '/other/' | relative_url }}"{% if page.url contains '/other/' %} class="active"{% endif %}>Other</a></li>
        <li><a href="{{ '/edit/' | relative_url }}"{% if page.url contains '/edit/' %} class="active"{% endif %}>Add/Edit</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="site-wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    {{ site.badges | size }} badges in the museum - 
    <a href="https://github.com/{{ site.repository }}">source</a> - 
    <a href="https://github.com/{{ site.repository }}/blob/main/README.md">README</a>
  </footer>
</body>
</html>
