title: "the hamster badge museum"
description: "A curated collection of electronic conference badges from DEF CON, SAINTCON, and beyond."
url: "https://hamster.github.io"
baseurl: "/badges"
repository: "hamster/badges"

collections:
  badges:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: badges
    values:
      layout: badge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - _template/
  - README.md
  - TODO.md
  - vendor/
